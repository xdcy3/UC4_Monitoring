name: UC4 Daily Full Suite

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  uc4-full-suite:
    runs-on: windows-latest
    timeout-minutes: 180

    env:
      CI: true
      TEMP: C:\temp
      TMP: C:\temp
      UC4USERNAME: ${{ secrets.UC4USERNAME }}
      UC4PASSWORD: ${{ secrets.UC4PASSWORD }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
      GOOGLE_SHEET_TAB: ${{ secrets.GOOGLE_SHEET_TAB }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create temp directory on C drive
        shell: pwsh
        run: |
          $tempPath = "C:\temp"
          if (-not (Test-Path $tempPath)) {
            New-Item -ItemType Directory -Path $tempPath -Force | Out-Null
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Debug - List workspace contents
        shell: pwsh
        run: |
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Github workspace: ${{ github.workspace }}"
          Write-Host "Contents of github.workspace:"
          Get-ChildItem -Path "${{ github.workspace }}" -Recurse -Depth 2 | Select-Object -Property FullName | Format-List

      - name: Install test dependencies
        shell: pwsh
        run: |
          $folder = Get-ChildItem -Path "${{ github.workspace }}" -Filter "*UC4_Automation_Suite*" -Directory -Recurse | Select-Object -First 1
          if ($folder) {
            Write-Host "Found folder at: $($folder.FullName)"
            Push-Location $folder.FullName
            npm ci
            npx playwright install chromium
            Pop-Location
          } else {
            Write-Error "Could not find UC4_Automation_Suite folder"
            exit 1
          }

      - name: Run UC4 full suite
        id: test_run
        shell: pwsh
        continue-on-error: true
        run: |
          $folder = Get-ChildItem -Path "${{ github.workspace }}" -Filter "*UC4_Automation_Suite*" -Directory -Recurse | Select-Object -First 1
          if ($folder) {
            Write-Host "Found folder at: $($folder.FullName)"
            Push-Location $folder.FullName
            $maxAttempts = 2
            $attempt = 1
            while ($attempt -le $maxAttempts) {
              Write-Host "Running UC4 suite attempt $attempt of $maxAttempts"
              npx playwright test tests/FullSuiteRun.spec.js --config=playwright.config.js
              if ($LASTEXITCODE -eq 0) {
                Pop-Location
                exit 0
              }
              if ($attempt -eq $maxAttempts) {
                Pop-Location
                exit $LASTEXITCODE
              }
              $attempt += 1
              Write-Host "Previous attempt failed; retrying..."
            }
            Pop-Location
          } else {
            Write-Error "Could not find UC4_Automation_Suite folder"
            exit 1
          }

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uc4-artifacts
          path: |
            UC4_Automation_Suite - share/playwright-report/
            UC4_Automation_Suite - share/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify Teams and Slack
        if: always()
        shell: pwsh
        env:
          RUN_OUTCOME: ${{ steps.test_run.outcome }}
        run: |
          $status = if ($env:RUN_OUTCOME -eq 'success') { '✅ Success' } else { '❌ Failed' }
          $message = "UC4 daily suite $status. Workflow: $env:GITHUB_WORKFLOW | Run: $env:GITHUB_RUN_ID"

          if (-not [string]::IsNullOrWhiteSpace('${{ secrets.TEAMS_WEBHOOK_URL }}')) {
            $body = @{ text = $message } | ConvertTo-Json -Compress
            try {
              Invoke-RestMethod -Method Post -Uri '${{ secrets.TEAMS_WEBHOOK_URL }}' -ContentType 'application/json' -Body $body | Out-Null
            } catch {
              Write-Host "Teams notification failed: $($_.Exception.Message)"
            }
          }

          if (-not [string]::IsNullOrWhiteSpace('${{ secrets.SLACK_WEBHOOK_URL }}')) {
            $body = @{ text = $message } | ConvertTo-Json -Compress
            try {
              Invoke-RestMethod -Method Post -Uri '${{ secrets.SLACK_WEBHOOK_URL }}' -ContentType 'application/json' -Body $body | Out-Null
            } catch {
              Write-Host "Slack notification failed: $($_.Exception.Message)"
            }
          }
